name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the test suite
        run: pytest -v

      - name: The CLI must report the planted defects as a failing build
        shell: bash
        run: |
          set +e
          python -m dq suite fixtures/orders.csv --spec examples/orders_suite.json
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "Expected exit 1 from the demo fixtures, got $code"
            exit 1
          fi
